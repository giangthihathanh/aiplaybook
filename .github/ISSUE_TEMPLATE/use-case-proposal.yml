name: New Use Case Proposal
description: Propose a governed AI Test Management use case.
title: "[Use Case]: "
labels: ["use-case", "needs-review"]
body:
  - type: input
    id: problem
    attributes:
      label: Business problem
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Expected value and target users
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Highest input data classification
      options: [Public, Internal, Confidential, Personal Data, Restricted, Unknown]
    validations:
      required: true
  - type: textarea
    id: kpi
    attributes:
      label: Proposed KPI, formula and denominator
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Primary risks and mandatory controls
    validations:
      required: true
  - type: input
    id: reviewer
    attributes:
      label: Proposed business owner and human reviewer
    validations:
      required: true
