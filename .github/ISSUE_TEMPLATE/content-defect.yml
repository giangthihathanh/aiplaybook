name: Content or Website Defect
description: Report an incorrect link, content mismatch, accessibility issue or UI defect.
title: "[Defect]: "
labels: ["defect", "needs-triage"]
body:
  - type: input
    id: location
    attributes:
      label: Page, file or URL
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options: [Accessibility, Broken link, Incorrect content, Mobile layout, Functional, Other]
    validations:
      required: true
